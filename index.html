<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>5-Day Gym Plan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#080808;--panel:#121212;--panel2:#181818;--line:#2b2b2b;
      --text:#f5f5f5;--muted:#a6a6a6;--radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    .app{max-width:760px;margin:0 auto;min-height:100vh;padding:0 14px 104px}
    header{position:sticky;top:0;z-index:20;background:rgba(8,8,8,.95);backdrop-filter:blur(14px);padding:16px 0 12px;border-bottom:1px solid var(--line)}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1{font-size:22px;margin:0;letter-spacing:-.03em}
    .date{font-size:13px;color:var(--muted);margin-top:2px}
    .pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:9px 12px;cursor:pointer}
    .day-tabs{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}
    .day-tabs::-webkit-scrollbar{display:none}
    .day-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:14px;padding:9px 11px;cursor:pointer;min-width:54px;text-align:center}
    .day-tab.active{background:var(--text);color:#050505;border-color:var(--text);font-weight:700}
    .hero{margin:16px 0 12px;padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,#171717,#101010);border-radius:var(--radius)}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
    .hero h2{font-size:27px;line-height:1.05;letter-spacing:-.04em;margin:7px 0 8px}
    .hero p{margin:0;color:var(--muted);line-height:1.45}
    .progress-wrap{margin-top:15px}
    .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
    .progress{height:8px;background:#262626;border-radius:999px;overflow:hidden}
    .progress>div{height:100%;background:var(--text);width:0%;transition:.2s}
    .exercise{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
    .exercise-head{padding:15px 15px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .exercise-title{font-weight:800;font-size:18px;letter-spacing:-.02em}
    .prescription{color:var(--muted);font-size:13px;margin-top:3px}
    .check{width:34px;height:34px;border-radius:50%;border:1px solid #464646;background:#1e1e1e;color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
    .check.done{background:#fff;color:#000;border-color:#fff}
    .last{font-size:12px;color:var(--muted);padding:0 15px 11px}
    .last strong{color:#ddd}
    .sets{border-top:1px solid var(--line)}
    .set-row{display:grid;grid-template-columns:34px minmax(78px,1fr) minmax(70px,.8fr) minmax(70px,.8fr) 40px;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #232323}
    .set-row:last-child{border-bottom:0}
    .set-num{font-weight:700;color:var(--muted);text-align:center}
    .field{display:flex;flex-direction:column;gap:4px}
    .field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    input{width:100%;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:10px;padding:10px 9px;min-width:0}
    input:focus{outline:2px solid #5a5a5a;outline-offset:1px}
    .set-check{width:36px;height:36px;border-radius:10px;border:1px solid #3a3a3a;background:#202020;color:#fff;cursor:pointer}
    .set-check.done{background:#fff;color:#000;border-color:#fff}
    .suggestion{margin:0 12px 12px;padding:10px 11px;border-radius:12px;background:#1d1d1d;color:#d8d8d8;font-size:12px;line-height:1.35}
    .timer-card,.cardio-card,.settings-card,.progress-card{margin:14px 0;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
    .section-title{font-size:17px;font-weight:800;margin-bottom:10px}
    .timer-display{font-size:42px;font-weight:800;letter-spacing:-.04em;margin:4px 0 12px}
    .button-row{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid #3b3b3b;background:#1d1d1d;color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}
    .btn.primary{background:#fff;color:#000;border-color:#fff}
    .btn.danger{color:#ffbcbc}
    .cardio-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .cardio-option{padding:11px 8px;text-align:center;border:1px solid #353535;background:#171717;color:#d2d2d2;border-radius:12px;cursor:pointer;font-size:13px}
    .cardio-option.active{background:#fff;color:#000;border-color:#fff;font-weight:700}
    .bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(8,8,8,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom))}
    .bottom-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .save-btn{border:0;border-radius:14px;padding:14px;font-weight:800;cursor:pointer}
    .save-btn.secondary{background:#222;color:#fff;border:1px solid #3a3a3a}
    .save-btn.primary{background:#fff;color:#000}
    .hidden{display:none!important}
    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-weight:800;font-size:13px;transition:.2s;z-index:70}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .history-item,.progress-item{padding:10px 0;border-bottom:1px solid #262626}
    .history-item:last-child,.progress-item:last-child{border-bottom:0}
    .small{font-size:12px;color:var(--muted)}
    .empty{color:var(--muted);font-size:14px;line-height:1.5}

    /* Workout Mode */
    .workout-mode{position:fixed;inset:0;z-index:60;background:#080808;overflow:auto;padding:14px 14px 110px}
    .wm-inner{max-width:760px;margin:0 auto}
    .wm-top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
    .wm-step{color:var(--muted);font-size:13px}
    .wm-exercise{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:10px}
    .wm-exercise h2{font-size:30px;letter-spacing:-.04em;margin:4px 0 4px}
    .wm-prescription{color:var(--muted);margin-bottom:14px}
    .wm-last{background:#191919;border-radius:14px;padding:12px;font-size:13px;color:#cfcfcf;margin-bottom:14px}
    .wm-set{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:end;padding:12px 0;border-top:1px solid #262626}
    .wm-set:first-of-type{border-top:0}
    .wm-set .set-num{align-self:center}
    .wm-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,8,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom));z-index:65}
    .wm-nav-inner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
    .rest-overlay{position:fixed;inset:0;background:rgba(0,0,0,.84);backdrop-filter:blur(8px);z-index:80;display:grid;place-items:center;padding:20px}
    .rest-box{width:min(420px,100%);background:#111;border:1px solid #333;border-radius:26px;padding:24px;text-align:center}
    .rest-box .timer-display{font-size:64px;margin:8px 0}
    .rest-box .small{margin-bottom:14px}
    .progress-bars{display:flex;flex-direction:column;gap:12px}
    .mini-bar{height:8px;background:#272727;border-radius:999px;overflow:hidden;margin-top:5px}
    .mini-bar>div{height:100%;background:#fff}
    @media(max-width:520px){
      .set-row{grid-template-columns:28px minmax(70px,1fr) minmax(58px,.75fr) minmax(58px,.75fr) 36px;gap:6px;padding:9px 8px}
      .wm-set{grid-template-columns:28px 1fr .82fr .72fr 40px;gap:6px}
      .field label{font-size:9px}
      input{padding:9px 7px}
      .hero h2{font-size:24px}
      .wm-exercise h2{font-size:26px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="topline">
      <div>
        <h1>Gym Plan</h1>
        <div class="date" id="dateLabel"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="pill" id="progressBtn">Progress</button>
        <button class="pill" id="historyBtn">History</button>
      </div>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow" id="dayEyebrow"></div>
      <h2 id="workoutTitle"></h2>
      <p id="workoutGoal"></p>
      <div class="progress-wrap">
        <div class="progress-label"><span>Workout progress</span><span id="progressText">0%</span></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="button-row" style="margin-top:16px">
        <button class="btn primary" id="startWorkoutMode">Start Workout</button>
      </div>
    </section>

    <section id="exerciseList"></section>

    <section class="timer-card">
      <div class="section-title">Rest Timer</div>
      <div class="timer-display" id="restDisplay">01:30</div>
      <div class="button-row">
        <button class="btn primary" data-rest="90">90 sec</button>
        <button class="btn" data-rest="120">2 min</button>
        <button class="btn" data-rest="180">3 min</button>
        <button class="btn" id="stopRest">Stop</button>
      </div>
    </section>

    <section class="cardio-card">
      <div class="section-title">20-Minute Cardio</div>
      <div class="cardio-options">
        <button class="cardio-option active" data-cardio="Incline treadmill">Incline walk</button>
        <button class="cardio-option" data-cardio="Elliptical">Elliptical</button>
        <button class="cardio-option" data-cardio="Stationary bike">Bike</button>
      </div>
      <div class="timer-display" id="cardioDisplay">20:00</div>
      <div class="button-row">
        <button class="btn primary" id="startCardio">Start</button>
        <button class="btn" id="pauseCardio">Pause</button>
        <button class="btn" id="resetCardio">Reset</button>
      </div>
    </section>

    <section class="progress-card hidden" id="progressPanel">
      <div class="section-title">Strength Progress</div>
      <div class="empty" style="margin-bottom:10px">Shows your best logged working weight for each exercise over your saved workouts.</div>
      <div id="progressList"></div>
      <div class="button-row" style="margin-top:12px">
        <button class="btn" id="closeProgress">Close</button>
      </div>
    </section>

    <section class="settings-card hidden" id="historyPanel">
      <div class="section-title">Workout History</div>
      <div id="historyList"></div>
      <div class="button-row" style="margin-top:12px">
        <button class="btn" id="closeHistory">Close</button>
        <button class="btn danger" id="clearHistory">Clear all history</button>
      </div>
    </section>
  </main>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="save-btn secondary" id="resetWorkout">Reset today</button>
    <button class="save-btn primary" id="saveWorkout">Save workout</button>
  </div>
</div>

<div class="workout-mode hidden" id="workoutMode">
  <div class="wm-inner">
    <div class="wm-top">
      <div>
        <div class="eyebrow">Workout Mode</div>
        <div class="wm-step" id="wmStep"></div>
      </div>
      <button class="pill" id="exitWorkoutMode">Exit</button>
    </div>
    <div class="wm-exercise" id="wmExercise"></div>
  </div>
  <div class="wm-nav">
    <div class="wm-nav-inner">
      <button class="save-btn secondary" id="wmPrev">Previous</button>
      <button class="save-btn secondary" id="wmRest">Rest</button>
      <button class="save-btn primary" id="wmNext">Next Exercise</button>
    </div>
  </div>
</div>

<div class="rest-overlay hidden" id="restOverlay">
  <div class="rest-box">
    <div class="eyebrow">Rest Timer</div>
    <div class="timer-display" id="overlayRestDisplay">01:30</div>
    <div class="small">Starts automatically when you complete a set.</div>
    <div class="button-row" style="justify-content:center">
      <button class="btn" id="restMinus">-30 sec</button>
      <button class="btn" id="skipRest">Skip</button>
      <button class="btn" id="restPlus">+30 sec</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Saved</div>

<script>
const EX={
 leg_press:['Leg Press','Weight',120],rdl:['Romanian Deadlift','Weight',120],lat_pd:['Lat Pulldown','Weight',90],cable_row:['Seated Cable Row','Weight',90],leg_curl:['Leg Curl','Weight',75],db_curl:['Dumbbell Curl','DB Weight',60],
 smith_bench:['Smith-Machine Bench Press','Weight',120],db_incline:['Incline Dumbbell Press','DB Weight',120],shoulder_press:['Machine Shoulder Press','Weight',90],lateral_raise:['Lateral Raise','DB Weight',60],tri_push:['Cable Triceps Pushdown','Weight',60],
 smith_squat:['Smith-Machine Squat','Weight',120],bulgarian:['Bulgarian Split Squat','DB Weight',90],neutral_pd:['Neutral-Grip Lat Pulldown','Weight',90],chest_row:['Chest-Supported Row','Weight',90],leg_ext:['Leg Extension','Weight',60],hammer:['Hammer Curl','DB Weight',60],
 incline_smith:['Incline Smith-Machine Press','Weight',120],chest_press:['Machine Chest Press','Weight',90],cable_lat:['Cable Lateral Raise','Weight',60],reverse_pec:['Reverse Pec Deck','Weight',60],overhead_tri:['Overhead Cable Triceps Extension','Weight',60],pushup:['Push-Ups','Bodyweight',60],wide_pd:['Wide-Grip Pulldown','Weight',90],cable_curl:['Cable Curl','Weight',60],
 ab_machine:['Ab Crunch Machine','Weight',50],knee_raise:["Captain's Chair Knee Raise",'Bodyweight',45],wood_chop:['Cable Wood Chop','Weight',45],trx_saw:['TRX Body Saw','Bodyweight',45],cable_crunch:['Cable Crunch','Weight',50],pallof:['Cable Pallof Press','Weight',45],trx_tuck:['TRX Knee Tuck','Bodyweight',45],plank:['Plank','Seconds',45]
};
const W=[
 {short:'Mon',title:'Legs + Back + Biceps',goal:'Heavier strength / hypertrophy',main:[['leg_press',3,8,12],['rdl',3,8,12],['lat_pd',3,8,12],['cable_row',3,8,12],['leg_curl',2,10,15],['db_curl',2,10,15]],fin:{muscle:'Biceps',title:'Cable Curl Triple Drop Set',text:'12–15 reps at 0–1 RIR, drop about 20–25%, go near failure, drop again, then finish near failure.',id:'cable_curl'},core:[['ab_machine',3,10,15],['knee_raise',3,10,15]]},
 {short:'Tue',title:'Chest + Shoulders + Triceps',goal:'Heavy pressing',main:[['smith_bench',3,6,10],['db_incline',3,8,12],['shoulder_press',2,8,12],['lateral_raise',3,12,15],['tri_push',3,10,15]],fin:{muscle:'Triceps',title:'Rope Pushdown Triple Drop Set',text:'12–15 reps at 0–1 RIR, drop about 20–25%, go near failure, drop again, then finish near failure.',id:'tri_push'},core:[['wood_chop',3,10,15],['trx_saw',3,8,12]]},
 {short:'Wed',title:'Legs + Back + Biceps',goal:'Different angles + moderate reps',main:[['smith_squat',3,8,12],['bulgarian',2,8,12],['neutral_pd',3,8,12],['chest_row',3,8,12],['leg_ext',2,12,15],['hammer',2,10,15]],fin:{muscle:'Biceps',title:'High-Rep Curl Burnout',text:'Use a light curl variation for one controlled set of 20–30 reps, ending when another clean rep is not there.',id:'cable_curl'},core:[['knee_raise',3,10,15],['cable_crunch',3,10,15]]},
 {short:'Thu',title:'Chest + Shoulders + Triceps',goal:'Hypertrophy / pump',main:[['incline_smith',3,8,12],['chest_press',3,8,12],['cable_lat',3,12,15],['reverse_pec',2,12,15],['overhead_tri',3,10,15],['pushup',1,8,30]],fin:{muscle:'Triceps',title:'Rope Pushdown Rest-Pause',text:'12–15 hard reps, rest 15–20 sec, 4–6 more, rest 15–20 sec, then 3–5 final reps.',id:'tri_push'},core:[['pallof',3,10,15],['trx_tuck',3,8,15]]},
 {short:'Fri',title:'Legs + Back + Biceps',goal:'Posterior chain + back',main:[['leg_press',3,10,15],['rdl',3,8,12],['wide_pd',3,10,12],['cable_row',3,10,15],['leg_curl',2,12,15],['cable_curl',2,10,15]],fin:{muscle:'Biceps',title:'Cable Curl Rest-Pause',text:'12–15 hard reps, rest 15–20 sec, 4–6 more, rest 15–20 sec, then 3–5 final reps.',id:'cable_curl'},core:[['ab_machine',3,10,15],['wood_chop',2,12,15],['plank',2,30,60]]}
];
const KEY='ryanGymApp_v3';
let db=(()=>{let v=localStorage.getItem(KEY);if(v)return JSON.parse(v);let old=localStorage.getItem('ryanGymApp_v2');if(old){try{let x=JSON.parse(old);localStorage.setItem(KEY,JSON.stringify(x));return x}catch(e){}}return {history:[],drafts:{}}})();
let selectedDay=Math.min(Math.max(new Date().getDay()-1,0),4), wmIndex=0, wmSteps=[];
let restEnd=0,restTick=null,lastSpoken=null,cardioEnd=0,cardioLeft=1200,cardioTick=null,cardioType='Incline treadmill';
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))} function iso(){return new Date().toISOString().slice(0,10)} function dk(){return `${iso()}_day${selectedDay}`}
function draft(){if(!db.drafts[dk()])db.drafts[dk()]={main:{},core:{},fin:{done:false,weight:'',reps:''},cardio:{type:cardioType,complete:false}};let d=db.drafts[dk()];if(!d.main)d.main=d.exercises||{};if(!d.core)d.core={};if(!d.fin)d.fin={done:false,weight:'',reps:''};return d}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)} function fmt(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function meta(id){return {name:EX[id][0],label:EX[id][1],rest:EX[id][2]}} function ensure(sec,i,def){let d=draft(),n=def[1];if(!d[sec][i])d[sec][i]={sets:Array.from({length:n},()=>({weight:'',reps:'',rir:'',done:false})),done:false};while(d[sec][i].sets.length<n)d[sec][i].sets.push({weight:'',reps:'',rir:'',done:false});return d[sec][i]}
function latest(id){let n=meta(id).name;for(let i=db.history.length-1;i>=0;i--){let a=[...(db.history[i].main||db.history[i].exercises||[]),...(db.history[i].core||[])],e=a.find(x=>x.id===id||x.name===n);if(e)return e}return null}
function lastText(id){let p=latest(id);return p?.sets?.length?p.sets.map(s=>`${s.weight||'—'} × ${s.reps||'—'}`).join(' · '):'No previous log yet'}
function renderTabs(){let c=document.getElementById('dayTabs');c.innerHTML='';W.forEach((w,i)=>{let b=document.createElement('button');b.className='day-tab'+(i===selectedDay?' active':'');b.innerHTML=`<strong>${w.short}</strong><div style="font-size:10px;margin-top:2px">${i%2===0?'Pull':'Push'}</div>`;b.onclick=()=>{selectedDay=i;render()};c.appendChild(b)})}
function autoMaybe(sec,i,def,si,wrap){let m=meta(def[0]),s=ensure(sec,i,def).sets[si];let ok=(m.label==='Bodyweight')?Number(s.reps)>0:(m.label==='Seconds')?Number(s.reps||s.weight)>0:Number(s.weight)>0&&Number(s.reps)>0;if(!ok||s.done)return;setTimeout(()=>{let a=document.activeElement;if(a&&wrap.contains(a))return;s.done=true;let ex=ensure(sec,i,def);ex.done=ex.sets.slice(0,def[1]).every(x=>x.done);saveDB();render();startRest(m.rest)},180)}
function card(sec,i,def){let [id,n,min,max]=def,m=meta(id),s=ensure(sec,i,def),c=document.createElement('div');c.className='exercise';c.innerHTML=`<div class="exercise-head"><div><div class="exercise-title">${m.name}</div><div class="prescription">${n} sets × ${min}–${max}</div></div><button class="check ${s.done?'done':''}">${s.done?'✓':'○'}</button></div><div class="last"><strong>Last:</strong> ${lastText(id)}</div><div class="sets"></div><div class="suggestion">${m.label==='DB Weight'?'Track the weight of one dumbbell. ':''}RIR is optional.</div>`;c.querySelector('.check').onclick=()=>{s.done=!s.done;s.sets.slice(0,n).forEach(x=>x.done=s.done);saveDB();render()};let se=c.querySelector('.sets');s.sets.slice(0,n).forEach((x,si)=>{let r=document.createElement('div');r.className='set-row';r.innerHTML=`<div class="set-num">${si+1}</div><div class="field"><label>${m.label}</label><input data-k="weight" inputmode="decimal" placeholder="${m.label==='Bodyweight'?'opt':'lbs'}" value="${x.weight||''}"></div><div class="field"><label>Reps</label><input data-k="reps" inputmode="numeric" placeholder="${min}-${max}" value="${x.reps||''}"></div><div class="field"><label>RIR</label><input data-k="rir" inputmode="numeric" placeholder="opt" value="${x.rir||''}"></div><button class="set-check ${x.done?'done':''}">${x.done?'✓':'○'}</button>`;r.querySelectorAll('input').forEach(inp=>{inp.oninput=e=>{x[e.target.dataset.k]=e.target.value;saveDB()};inp.onblur=()=>autoMaybe(sec,i,def,si,r)});r.querySelector('.set-check').onclick=()=>{x.done=!x.done;s.done=s.sets.slice(0,n).every(y=>y.done);saveDB();render();if(x.done)startRest(m.rest)};se.appendChild(r)});return c}
function render(){renderTabs();let w=W[selectedDay],d=draft();document.getElementById('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});document.getElementById('dayEyebrow').textContent=`Day ${selectedDay+1} • Main + arms + core + cardio`;document.getElementById('workoutTitle').textContent=w.title;document.getElementById('workoutGoal').textContent=w.goal;let l=document.getElementById('exerciseList');l.innerHTML='';w.main.forEach((x,i)=>l.appendChild(card('main',i,x)));let f=document.createElement('div');f.className='exercise';f.innerHTML=`<div class="exercise-head"><div><div class="exercise-title">🔥 ${w.fin.muscle} Finisher</div><div class="prescription">${w.fin.title}</div></div></div><div class="suggestion">${w.fin.text}</div>`;l.appendChild(f);let coreTitle=document.createElement('div');coreTitle.style='font-weight:800;font-size:18px;margin:18px 2px 8px';coreTitle.textContent='Core Finisher';l.appendChild(coreTitle);w.core.forEach((x,i)=>l.appendChild(card('core',i,x)));updateProgress();saveDB()}
function updateProgress(){let w=W[selectedDay],d=draft(),total=1,done=d.fin.done?1:0;['main','core'].forEach(sec=>w[sec].forEach((def,i)=>{total+=def[1];done+=(d[sec][i]?.sets||[]).slice(0,def[1]).filter(x=>x.done).length}));let p=Math.round(done/total*100);document.getElementById('progressBar').style.width=p+'%';document.getElementById('progressText').textContent=p+'%'}
function speak(n){if(document.hidden||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(n));u.rate=1.2;speechSynthesis.speak(u)}catch(e){}}
function restUpdate(){if(!restEnd)return;let left=(restEnd-Date.now())/1000,n=Math.ceil(left);document.getElementById('restDisplay').textContent=fmt(left);document.getElementById('overlayRestDisplay').textContent=fmt(left);if(n<=10&&n>=1&&n!==lastSpoken){lastSpoken=n;speak(n)}if(left<=0){clearInterval(restTick);restTick=null;restEnd=0;lastSpoken=null;document.getElementById('restOverlay').classList.add('hidden');if(navigator.vibrate)navigator.vibrate([150,100,150]);toast('Rest complete')}}
function startRest(sec=90){restEnd=Date.now()+sec*1000;lastSpoken=null;document.getElementById('restOverlay').classList.remove('hidden');clearInterval(restTick);restUpdate();restTick=setInterval(restUpdate,250)}
document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(Number(b.dataset.rest)));document.getElementById('stopRest').onclick=()=>{clearInterval(restTick);restEnd=0};document.getElementById('skipRest').onclick=()=>{clearInterval(restTick);restEnd=0;document.getElementById('restOverlay').classList.add('hidden')};document.getElementById('restMinus').onclick=()=>{if(restEnd)restEnd=Math.max(Date.now(),restEnd-30000);restUpdate()};document.getElementById('restPlus').onclick=()=>{if(restEnd)restEnd+=30000;restUpdate()};
function cardioUpdate(){if(!cardioEnd){document.getElementById('cardioDisplay').textContent=fmt(cardioLeft);return}let left=(cardioEnd-Date.now())/1000;cardioLeft=Math.max(0,left);document.getElementById('cardioDisplay').textContent=fmt(cardioLeft);let w=document.getElementById('wmCardioDisplay');if(w)w.textContent=fmt(cardioLeft);if(left<=0){clearInterval(cardioTick);cardioEnd=0;draft().cardio.complete=true;saveDB();toast('Cardio complete')}}
document.querySelectorAll('.cardio-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cardio-option').forEach(x=>x.classList.remove('active'));b.classList.add('active');cardioType=b.dataset.cardio;draft().cardio.type=cardioType;saveDB()});document.getElementById('startCardio').onclick=()=>{cardioEnd=Date.now()+cardioLeft*1000;clearInterval(cardioTick);cardioTick=setInterval(cardioUpdate,500);cardioUpdate()};document.getElementById('pauseCardio').onclick=()=>{if(cardioEnd)cardioLeft=Math.max(0,(cardioEnd-Date.now())/1000);cardioEnd=0;clearInterval(cardioTick);cardioUpdate()};document.getElementById('resetCardio').onclick=()=>{cardioEnd=0;clearInterval(cardioTick);cardioLeft=1200;draft().cardio.complete=false;saveDB();cardioUpdate()};document.addEventListener('visibilitychange',()=>{if(!document.hidden){restUpdate();cardioUpdate()}});
function steps(){let w=W[selectedDay],a=[];w.main.forEach((d,i)=>a.push({kind:'ex',sec:'main',i,def:d}));a.push({kind:'fin',data:w.fin});w.core.forEach((d,i)=>a.push({kind:'ex',sec:'core',i,def:d,core:true}));a.push({kind:'cardio'});return a}
function wmRender(){wmSteps=steps();let st=wmSteps[wmIndex],box=document.getElementById('wmExercise');document.getElementById('wmStep').textContent=`Step ${wmIndex+1} of ${wmSteps.length}`;if(st.kind==='ex'){let [id,n,min,max]=st.def,m=meta(id),s=ensure(st.sec,st.i,st.def);let h=`<div class="eyebrow">${st.core?'CORE':'WORKOUT'}</div><h2>${m.name}</h2><div class="wm-prescription">${n} sets × ${min}–${max}</div><div class="wm-last"><strong>Last:</strong> ${lastText(id)}${m.label==='DB Weight'?'<br><span class="small">DB Weight = one dumbbell.</span>':''}</div>`;s.sets.slice(0,n).forEach((x,si)=>h+=`<div class="wm-set" data-wrap="${si}"><div class="set-num">${si+1}</div><div class="field"><label>${m.label}</label><input data-si="${si}" data-k="weight" inputmode="decimal" value="${x.weight||''}"></div><div class="field"><label>Reps</label><input data-si="${si}" data-k="reps" inputmode="numeric" placeholder="${min}-${max}" value="${x.reps||''}"></div><div class="field"><label>RIR</label><input data-si="${si}" data-k="rir" inputmode="numeric" placeholder="opt" value="${x.rir||''}"></div><button class="set-check ${x.done?'done':''}" data-d="${si}">${x.done?'✓':'○'}</button></div>`);box.innerHTML=h;box.querySelectorAll('input').forEach(inp=>{inp.oninput=e=>{s.sets[+e.target.dataset.si][e.target.dataset.k]=e.target.value;saveDB()};inp.onblur=e=>{let si=+e.target.dataset.si,wrap=e.target.closest('[data-wrap]');autoMaybe(st.sec,st.i,st.def,si,wrap)}});box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=s.sets[+b.dataset.d];x.done=!x.done;s.done=s.sets.slice(0,n).every(y=>y.done);saveDB();wmRender();render();if(x.done)startRest(m.rest)})}else if(st.kind==='fin'){let d=draft().fin,f=st.data,m=meta(f.id);box.innerHTML=`<div class="eyebrow">ARM FINISHER</div><h2>🔥 ${f.title}</h2><div class="wm-last">${f.text}</div><div class="button-row"><div class="field" style="flex:1"><label>${m.label}</label><input id="fw" inputmode="decimal" value="${d.weight||''}"></div><div class="field" style="flex:1"><label>First reps</label><input id="fr" inputmode="numeric" value="${d.reps||''}"></div></div><button class="btn primary" id="fd" style="margin-top:14px">${d.done?'✓ Finisher Complete':'Complete Finisher'}</button>`;document.getElementById('fw').oninput=e=>{d.weight=e.target.value;saveDB()};document.getElementById('fr').oninput=e=>{d.reps=e.target.value;saveDB()};document.getElementById('fd').onclick=()=>{d.done=!d.done;saveDB();wmRender();render();if(d.done)startRest(60)}}else{box.innerHTML=`<div class="eyebrow">FINAL STEP</div><h2>20-Minute Cardio</h2><div class="wm-last">Moderate pace. Incline walking, elliptical, or bike.</div><div class="timer-display" id="wmCardioDisplay">${fmt(cardioLeft)}</div><div class="button-row"><button class="btn primary" id="wcStart">Start</button><button class="btn" id="wcPause">Pause</button></div>`;document.getElementById('wcStart').onclick=()=>document.getElementById('startCardio').click();document.getElementById('wcPause').onclick=()=>document.getElementById('pauseCardio').click()}document.getElementById('wmPrev').disabled=wmIndex===0;document.getElementById('wmNext').textContent=wmIndex===wmSteps.length-1?'Finish Workout':'Next'}
document.getElementById('startWorkoutMode').onclick=()=>{wmIndex=0;document.getElementById('workoutMode').classList.remove('hidden');wmRender()};document.getElementById('exitWorkoutMode').onclick=()=>{document.getElementById('workoutMode').classList.add('hidden');render()};document.getElementById('wmPrev').onclick=()=>{if(wmIndex>0){wmIndex--;wmRender()}};document.getElementById('wmNext').onclick=()=>{if(wmIndex<wmSteps.length-1){wmIndex++;wmRender()}else{document.getElementById('workoutMode').classList.add('hidden');toast('Workout complete')}};document.getElementById('wmRest').onclick=()=>{let s=wmSteps[wmIndex],sec=s?.kind==='ex'?meta(s.def[0]).rest:60;startRest(sec)};
document.getElementById('saveWorkout').onclick=()=>{let w=W[selectedDay],d=draft(),pack=sec=>w[sec].map((def,i)=>({id:def[0],name:meta(def[0]).name,sets:(d[sec][i]?.sets||[]).slice(0,def[1]).map(x=>({...x}))}));db.history.push({id:Date.now(),date:new Date().toISOString(),day:selectedDay,title:w.title,main:pack('main'),core:pack('core'),finisher:{...d.fin,title:w.fin.title},cardio:{...d.cardio}});delete db.drafts[dk()];saveDB();toast('Workout saved');render()};document.getElementById('resetWorkout').onclick=()=>{delete db.drafts[dk()];saveDB();render();toast('Today reset')};
function hist(){let p=document.getElementById('historyPanel'),l=document.getElementById('historyList');p.classList.remove('hidden');document.getElementById('progressPanel').classList.add('hidden');l.innerHTML=db.history.length?db.history.slice().reverse().map(h=>`<div class="history-item"><strong>${new Date(h.date).toLocaleDateString()}</strong> — ${h.title}<div class="small">${h.finisher?.done?'Finisher complete • ':''}${h.cardio?.complete?'Cardio complete':'Saved'}</div></div>`).join(''):'<div class="empty">No saved workouts yet.</div>';p.scrollIntoView({behavior:'smooth'})}document.getElementById('historyBtn').onclick=hist;document.getElementById('closeHistory').onclick=()=>document.getElementById('historyPanel').classList.add('hidden');document.getElementById('clearHistory').onclick=()=>{if(confirm('Delete all saved workout history?')){db.history=[];saveDB();hist()}};
function prog(){let p=document.getElementById('progressPanel'),l=document.getElementById('progressList');p.classList.remove('hidden');document.getElementById('historyPanel').classList.add('hidden');let rows=[];Object.keys(EX).filter(id=>!['Bodyweight','Seconds'].includes(meta(id).label)).forEach(id=>{let pts=[];db.history.forEach(h=>{let a=[...(h.main||h.exercises||[]),...(h.core||[])],e=a.find(x=>x.id===id||x.name===meta(id).name);if(e){let b=Math.max(0,...e.sets.map(s=>+s.weight||0));if(b)pts.push(b)}});if(pts.length)rows.push({n:meta(id).name,a:pts[0],b:pts.at(-1),m:Math.max(...pts)})});l.innerHTML=rows.length?rows.map(r=>`<div class="progress-item"><strong>${r.n}</strong><div class="small">${r.a} lbs → ${r.b} lbs • ${r.b-r.a>=0?'+':''}${r.b-r.a} lbs</div><div class="mini-bar"><div style="width:${Math.max(8,r.b/r.m*100)}%"></div></div></div>`).join(''):'<div class="empty">Save weighted workouts to see progress.</div>';p.scrollIntoView({behavior:'smooth'})}document.getElementById('progressBtn').onclick=prog;document.getElementById('closeProgress').onclick=()=>document.getElementById('progressPanel').classList.add('hidden');
render();cardioUpdate();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
