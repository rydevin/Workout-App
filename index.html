function build(){let w=W[day],a=[];w.main.forEach((d,i)=>a.push({k:'ex',sec:'main',i,def:d}));a.push({k:'fin',data:w.fin});w.core.forEach((d,i)=>a.push({k:'ex',sec:'core',i,def:d,core:true}));a.push({k:'cardio'});return a}function nextLabel(){let s=steps[wi+1];if(!s)return'Finish workout';if(s.k==='ex')return`${EX[s.def[0]][0]} • ${s.def[1]} × ${s.def[2]}–${s.def[3]}`;if(s.k==='fin')return`Arm Finisher • ${s.data.t}`;return'20-Minute Cardio'}function autoDone(step,si){let s=ensure(step.sec,step.i,step.def).sets[si],m=EX[step.def[0]],ok=m[1]=='Load'?Number(s.reps)>0:m[1]=='Seconds'?Number(s.reps||s.weight)>0:Number(s.weight)>0&&Number(s.reps)>0;if(!ok||s.done)return;setTimeout(()=>{let active=document.activeElement;if(active&&active.closest&&active.closest(`[data-wrap="${si}"]`))return;if(!s.done){let ex=ensure(step.sec,step.i,step.def);s.done=true;ex.done=ex.sets.slice(0,step.def[1]).every(x=>x.done);save();wmRender();render();startRest(restFor(step.def[0]),si===step.def[1]-1&&ex.done)}},180)}
function wmRender(){steps=build();let st=steps[wi],box=$('wmcard');$('wmstep').textContent=`Step ${wi+1} of ${steps.length}`;if(st.k==='ex'){let [id,n,min,max]=st.def,m=EX[id],s=ensure(st.sec,st.i,st.def),html=`<div class="wmcard">${st.core?'<span class="badge" style="background:#222;color:#fff;border:1px solid #555">CORE</span>':''}<h2>${m[0]}</h2><div class="sub">${n} sets × ${min}–${max} • Rest ${restFor(id)} sec</div><div class="wm-last"><strong>Last:</strong> ${prevTxt(id)}<br><span class="small">${s.prefilledFromHistory?'Today is pre-filled from your last completed workout. Change only what differs. ':''}${prog(st.def)}</span></div>`;s.sets.slice(0,n).forEach((x,si)=>{html+=`<div class="wmset" data-wrap="${si}"><div class="setnum">${si+1}</div><div class="field"><label>${m[1]}</label><input data-si="${si}" data-k="weight" inputmode="decimal" placeholder="${m[1]=='Load'?'optional':'lbs'}" value="${x.weight??''}"></div><div class="field"><label>${m[1]=='Seconds'?'Time':'Reps'}</label><input data-si="${si}" data-k="reps" inputmode="numeric" placeholder="${min}-${max}" value="${x.reps??''}"></div><div class="field"><label>RIR</label><input data-si="${si}" data-k="rir" inputmode="numeric" placeholder="opt" value="${x.rir??''}"></div><button class="setcheck ${x.done?'done':''}" data-done="${si}">${x.done?'✓':'☐'}</button></div>`});html+=`<div class="field" style="margin-top:12px"><label>Exercise note</label><input id="wmNote" placeholder="Optional note for this exercise" value="${s.note||''}"></div><div class="next"><span class="small">WHAT'S NEXT</span><strong>${nextLabel()}</strong></div></div>`;box.innerHTML=html;$('wmNote').oninput=e=>{s.note=e.target.value;save()};box.querySelectorAll('input[data-si]').forEach(inp=>{inp.oninput=e=>{s.sets[Number(e.target.dataset.si)][e.target.dataset.k]=e.target.value;save()};inp.onblur=e=>autoDone(st,Number(e.target.dataset.si))});box.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let si=Number(b.dataset.done),x=s.s function finalize(){let w=W[day],d=draft(),clean=x=>({weight:x?.weight||'',reps:x?.reps||'',rir:x?.rir||'',done:!!x?.done}),pack=sec=>w[sec].map((def,i)=>{let ex=d[sec]?.[i]||ensure(sec,i,def);return{id:def[0],name:EX[def[0]][0],note:ex.note||'',sets:Array.from({length:def[1]},(_,si)=>clean(ex.sets?.[si]))}}),entry={id:Date.now(),workoutKey:wkey(),date:new Date().toISOString(),day,title:w.t,main:pack('main'),core:pack('core'),finisher:{...d.finisher,title:w.fin.t},cardio:{...d.cardio},elapsedSeconds:workoutStart?Math.round((Date.now()-workoutStart)/1000):0};let ix=DB.history.findIndex(h=>h.workoutKey===entry.workoutKey);if(ix>=0){entry.id=DB.history[ix].id||entry.id;DB.history[ix]=entry}else DB.history.push(entry);save();let check=sp(KEY),saved=check?.history?.find(h=>h.workoutKey===entry.workoutKey);if(!saved||saved.main?.length!==w.main.length||saved.core?.length!==w.core.length){toast('History save failed — draft kept');return}delete DB.drafts[dkey()];workoutStart=null;clearInterval(elapsedTimer);wakeRel();save();toast('Full workout saved to History');render()}$('save').onclick=finalize;$('reset').onclick=()=>{delete DB.drafts[dkey()];workoutStart=null;clearInterval(elapsedTimer);wakeRel();save();render();toast('Today reset')};$('histBtn').onclick=()=>{let p=$('history'),l=$('historyList');p.classList.remove('hidden');$('progress').classList.add('hidden');l.innerHTML=DB.history.length?DB.history.slice().reverse().map(h=>{let all=[...(h.main||h.exercises||[]),...(h.core||[])],done=all.reduce((n,e)=>n+(e.sets||[]).filter(x=>x.done).length,0),total=all.reduce((n,e)=>n+(e.sets||[]).length,0);return `<div class="hist"><strong>${new Date(h.date).toLocaleDateString()}</strong> — ${h.title}<div class="small">Workout time: ${fmt(h.elapsedSeconds||0)} • ${all.length} movements • ${done}/${total} sets completed</div><details style="margin-top:8px"><summary class="small">View workout</summary>${all.map(e=>`<div class="small" style="padding:6px 0;border-top:1px solid #222"><s
